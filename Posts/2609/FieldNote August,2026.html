            <div class="page-body"><p class="" dir="auto" id="3c00f3dd-ffe1-807d-b722-f415a35ee411"><a href="../../index.html?tag=2026" class="article-tag">#2026</a> <a href="../../index.html?tag=08" class="article-tag">#08</a></p><hr dir="auto" id="3c00f3dd-ffe1-800a-8424-c54e3d68fd09"/><p class="" dir="auto" id="3c00f3dd-ffe1-8097-9da3-dc7dfece63d1"><a href="../../index.html?tag=18" class="article-tag">#18</a></p><p class="" dir="auto" id="3c00f3dd-ffe1-80be-b26d-f1a0ac200c9c">ぼーとしていると何もはじまらないので、フィールドノートに書いて、HPにアップしてみる。</p><p class="" dir="auto" id="3c00f3dd-ffe1-80df-adc9-f44d4869e287">もうあと5日ぐらいで2学期がはじまる。まだすべて終わってないし、予定していた授業準備もできていない。毎日、授業の準備ができない1学期だった。その反省を生かして2学期の戦略はまず、</p><p class="" dir="auto" id="3c00f3dd-ffe1-803d-b005-fda210c12324">このフィールドノートを同じようにアップしていこう！</p><p class="" dir="auto" id="3c00f3dd-ffe1-80c7-bb4f-e9a61300d48f">Let’s try!</p><figure class="image" data-notion-image="FieldNote August,2026_01.jpg" dir="ltr" id="3c00f3dd-ffe1-811c-9afd-e202a9d47a95"><a href="./image/FieldNote August,2026_01.jpg" target="_blank"><img src="./image/FieldNote August,2026_01.jpg"/></a></figure></div>
